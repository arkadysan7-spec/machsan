<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קריאה לעובד המחסן</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#121212;--mute:#6b6b6b;--red:#e3342f;--card:#f4f4f1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.5 Rubik,system-ui,sans-serif;display:flex;flex-direction:column}
header{background:#e3342f;color:#fff;padding:18px 20px}
header small{opacity:.85;font-size:14px;display:block;margin-top:10px}
.lg{display:block;height:52px;width:auto;background:#fff;border-radius:10px;padding:6px 10px}
.music{display:flex;align-items:center;gap:12px;background:#121212;color:#fff;border-radius:18px;padding:14px 16px}
.music button{background:#fff;color:#121212;min-width:48px;padding:0 16px}
.music span{font-size:15px;opacity:.85}
.eq{display:flex;gap:3px;align-items:end;height:18px;margin-inline-start:auto}.eq i{width:4px;background:#e3342f;height:4px;border-radius:2px}
.on .eq i{animation:eq 1s infinite ease-in-out}.on .eq i:nth-child(2){animation-delay:.2s}.on .eq i:nth-child(3){animation-delay:.4s}.on .eq i:nth-child(4){animation-delay:.6s}
@keyframes eq{50%{height:18px}}
main{flex:1;padding:24px 20px;max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(28px,8vw,40px);line-height:1.1;margin:4px 0 0}
.status{background:var(--card);border-radius:18px;padding:22px;display:flex;gap:16px;align-items:center}
.dot{width:18px;height:18px;border-radius:50%;background:var(--red);flex:none;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.status.done .dot{animation:none;background:#121212}
.closed{background:#fff;border:3px solid #e3342f;border-radius:18px;padding:22px}.closed b{display:block;font-size:22px;margin-bottom:6px}
.status b{display:block;font-size:20px}
.reply{display:none;background:#e3342f;color:#fff;border-radius:18px;padding:24px}
.reply.on{display:block}
.reply small{opacity:.7}
.reply p{font-size:clamp(26px,7vw,34px);font-weight:700;margin:6px 0 0;line-height:1.2}
label{font-size:15px;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:6px}
input{flex:1;min-width:0;font:inherit;font-size:16px;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid #ddd}
button{font:inherit;font-size:16px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--red);color:#fff;font-weight:500}
button:disabled{opacity:.5}
.hint{font-size:14px;color:var(--mute);margin:0}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head><body>
<header><img class="lg" src="logo.png" alt="מנשר לאמנות"><small>מחסן ציוד</small><h1>קראנו לעובד המחסן</h1></header>
<main>
<div class="status" id="st"><span class="dot"></span><div><b id="stT">שולח קריאה…</b><span id="stS" class="hint">רגע אחד</span></div></div>
<div class="reply" id="rep"><small>תשובה מעובד המחסן</small><p id="repT"></p></div>
<div><label for="msg" style="font-size:18px;color:#121212;font-weight:500">מה צריך? כתבו בקצרה</label>
<div class="row"><input id="msg" maxlength="140" placeholder="למשל: דנה – באתי להחזיר מצלמה"><button id="send">שלח</button></div></div>
<div class="music" id="mus"><button id="mBtn" aria-label="הפעל מוזיקה">▶</button><span id="mTxt">מוזיקה בזמן ההמתנה</span><span class="eq"><i></i><i></i><i></i><i></i></span></div>
<p class="hint">השאירו את הדף פתוח – התשובה תופיע כאן.</p>
</main>
<script>
{
const T='minshar-machsan-k7q3z9wp',R=T+'-reply',H='https://ntfy.sh/';
const $=s=>document.getElementById(s);
const since=Math.floor(Date.now()/1000)-2;
const acts=[
 {action:'http',label:'עולה',url:H+R,method:'POST',body:'עולה עכשיו!',clear:true},
 {action:'http',label:'בדרך, 5 דק׳',url:H+R,method:'POST',body:'בדרך – מגיע תוך 5 דקות',clear:true},
 {action:'view',label:'כתוב תשובה',url:H+R}];
function pub(o){return fetch(H,{method:'POST',body:JSON.stringify(Object.assign({topic:T,priority:5,tags:['bell']},o))})}
const nowD=new Date(),il=new Date(nowD.toLocaleString('en-US',{timeZone:'Asia/Jerusalem'})),dw=il.getDay(),hr=il.getHours();
if(dw>4||hr<9||hr>=13){document.querySelector('main').innerHTML='<div class="closed"><b>הקריאה זמינה א׳–ה׳, 9:00 עד 13:00</b>מ־13:00 עדנאן במחסן – פנו אליו ישירות.</div>';document.querySelector('header h1').textContent='המחסן סגור לקריאות כרגע';throw 0}
let last=0;try{last=+sessionStorage.getItem('called')||0}catch(e){}
const fresh=Date.now()-last<120000;
(fresh?Promise.resolve({ok:true}):pub({title:'קוראים לך למחסן',message:'מישהו סרק את הברקוד במחסן הציוד',actions:acts}))
.then(r=>{if(!r.ok)throw 0;try{sessionStorage.setItem('called',String(fresh?last:Date.now()))}catch(e){}
 $('stT').textContent='הקריאה נשלחה';$('stS').textContent='עובד המחסן קיבל התראה. מחכים לתשובה…'})
.catch(()=>{$('stT').textContent='הקריאה לא נשלחה';$('stS').textContent='בדקו חיבור לאינטרנט ורעננו את הדף'});
function show(t){$('repT').textContent=t;$('rep').classList.add('on');$('st').classList.add('done');$('stT').textContent='עובד המחסן ענה'; $('stS').textContent=''}
try{const es=new EventSource(H+R+'/sse?since='+(fresh?Math.floor(last/1000)-2:since));
 es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==='message'&&m.message)show(m.message)}catch(x){}}}catch(e){}
function buildScore(AC,OUT,t0){
const B=0.6,S=B/4,BAR=B*4;
const f=m=>440*Math.pow(2,(m-69)/12);
const nb=(()=>{const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b})();
const env=(g,t,a,p,dec)=>{g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)};
const nz=(t,type,fr,q,p,dec)=>{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;fl.type=type;fl.frequency.value=fr;fl.Q.value=q;env(g,t,.002,p,dec);s.connect(fl).connect(g).connect(OUT);s.start(t,Math.random()*1.5);s.stop(t+dec+.05)};
const kick=(t,v=1)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);env(g,t,.003,.9*v,.42);o.connect(g).connect(OUT);o.start(t);o.stop(t+.5)};
const snare=(t,v=1)=>{nz(t,'highpass',1500,.7,.45*v,.2);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(160,t+.08);env(g,t,.002,.25*v,.1);o.connect(g).connect(OUT);o.start(t);o.stop(t+.15)};
const hat=(t,v=1,open)=>nz(t,'highpass',7500,.8,.16*v,open?.22:.035);
const tick=(t,hi,v=1)=>nz(t,'bandpass',hi?5200:3100,9,.95*v,.03);
const tom=(t,p=1,v=1)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150*p,t);o.frequency.exponentialRampToValueAtTime(75*p,t+.25);env(g,t,.003,.6*v,.35);o.connect(g).connect(OUT);o.start(t);o.stop(t+.4)};
const crash=t=>nz(t,'highpass',4000,.5,.25,2.2);
const tone=(type,n,t,len,v,cut)=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=type;o.frequency.value=f(n);fl.type='lowpass';fl.frequency.value=cut;env(g,t,.008,v,len);o.connect(fl).connect(g).connect(OUT);o.start(t);o.stop(t+len+.05)};
const bass=(n,t,len,v=.3)=>{tone('sawtooth',n,t,len,v,420);tone('sine',n-12,t,len,v*.6,200)};
const keys=(n,t,v=.16)=>{tone('triangle',n,t,1.6,v,3000);tone('sine',n+12,t,1.0,v*.35,4000)};
const pad=(ns,t,dur,v=.04)=>ns.forEach(n=>[-7,7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f(n);o.detune.value=d;fl.type='lowpass';fl.frequency.value=1100;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(1.2,dur/2));g.gain.setValueAtTime(v,t+dur-.3);g.gain.linearRampToValueAtTime(0,t+dur+.8);o.connect(fl).connect(g).connect(OUT);o.start(t);o.stop(t+dur+1)}));
const lead=(n,t,len,v=.11)=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter(),lf=AC.createOscillator(),lg=AC.createGain();o.type='square';o.frequency.value=f(n);fl.type='lowpass';fl.frequency.setValueAtTime(1200,t);fl.frequency.linearRampToValueAtTime(2600,t+len*.5);lf.frequency.value=5.5;lg.gain.value=7;lf.connect(lg).connect(o.detune);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.setValueAtTime(v,t+len*.8);g.gain.linearRampToValueAtTime(0.0001,t+len+.15);o.connect(fl).connect(g).connect(OUT);o.start(t);lf.start(t);o.stop(t+len+.2);lf.stop(t+len+.2)};
const riser=(t,d)=>{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;s.loop=true;fl.type='bandpass';fl.Q.value=3;fl.frequency.setValueAtTime(300,t);fl.frequency.exponentialRampToValueAtTime(7000,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+d);s.connect(fl).connect(g).connect(OUT);s.start(t);s.stop(t+d)};
const CH={Dm:[50,53,57],Bb:[50,53,58],F:[48,53,57],C:[48,52,55],Am:[48,52,57],Gm:[50,55,58],A:[49,52,57]};
const RT={Dm:38,Bb:34,F:41,C:36,Am:33,Gm:43,A:33};
let t=t0;
// A — intro: a clock ticking, a chord breathing
pad(CH.Dm,t,BAR*4,.06);
for(let i=0;i<32;i++)tick(t+i*B/2,i%2===0,i%2?.6:.9);
[[74,2],[69,3],[77,4],[76,5],[74,6],[72,7]].forEach(([n,b])=>keys(n,t+BAR*2+(b-2)*B,.22));
[0,1,2,3].forEach(i=>tom(t+BAR*3+B*3+i*S,1.4-i*.15,.7));
t+=BAR*4;
// B — the drive
const bP=['Dm','Bb','F','C','Gm','A'];
bP.forEach((c,bi)=>{const T=t+bi*BAR;pad(CH[c],T,BAR,.025);
 for(let s=0;s<16;s++){const x=T+s*S;hat(x,s%2?.55:1);
  if(s===0||s===6||s===8||s===11)kick(x,s===0?1:.8);
  if(s===4||s===12)snare(x);
  if(s%2===0)bass(RT[c]+(s===14?12:0),x,S*1.6)}
 if(bi===5){[8,9,10,11,12,13,14,15].forEach((s,i)=>tom(T+s*S,1.5-i*.1,.6+i*.05))}});
t+=BAR*6;
// C — the ballad turn
const cP=['F','Am','Bb','C','Dm'];
cP.forEach((c,bi)=>{const T=t+bi*BAR,ch=CH[c];pad(ch,T,BAR,.05);bass(RT[c],T,BAR*.95,.26);
 const ar=[ch[0]+12,ch[1]+12,ch[2]+12,ch[1]+24,ch[2]+12,ch[1]+12,ch[0]+12,ch[2]];ar.forEach((n,i)=>keys(n,T+i*B/2,.2));
 for(let q=0;q<4;q++)tick(T+q*B,q%2===0,.6)});
const RT0=t+BAR*4;riser(RT0,BAR);
for(let i=0;i<16;i++){const x=RT0+BAR*(1-Math.pow(1-i/16,1.6));snare(x,.25+i*.045)}
t+=BAR*5;
// D — climax
crash(t);kick(t,1.2);
const dP=['Dm','Bb','Gm','A','Dm','Bb','A'];
const mel=[[[74,1],[77,.5],[81,.5],[86,2]],[[84,.5],[82,.5],[81,1],[77,2]],[[79,1],[82,1],[86,1],[84,1]],[[85,2],[88,1],[81,1]],[[86,1],[89,1],[88,.5],[86,.5],[84,1]],[[82,1],[81,1],[79,1],[77,1]],[[76,2],[73,1],[69,1]]];
dP.forEach((c,bi)=>{const T=t+bi*BAR;pad(CH[c],T,BAR,.035);
 for(let s=0;s<16;s++){const x=T+s*S;hat(x,s%2?.6:1,s%4===2);
  if(s%4===0||s===14)kick(x);
  if(s===4||s===12)snare(x,1.1);
  bass(RT[c]+(s%4===3?12:0),x,S*.9,.26)}
 let b=0;mel[bi].forEach(([n,d])=>{lead(n,T+b*B,d*B*.95);b+=d});
 if(bi===6)[8,9,10,11,12,13,14,15].forEach((s,i)=>tom(T+s*S,1.6-i*.12,.7+i*.04))});
t+=BAR*7;
// E — outro: the clock winds down
crash(t);kick(t,1.1);pad(CH.Dm,t,BAR*2.6,.06);
[[62,0],[69,.8],[74,1.6],[77,2.6],[74,4]].forEach(([n,d])=>keys(n,t+d,.22));
let x=t+.3,iv=.3;while(x<t+BAR*3-.2){tick(x,Math.round((x-t)/iv)%2===0,.7);x+=iv;iv*=1.13}
return BAR*25;
}

let AC=null,MG=null,mt=null;
function startMusic(){AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.42;
const cmp=AC.createDynamicsCompressor();cmp.threshold.value=-14;cmp.ratio.value=3;
const len=AC.sampleRate*2.5,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
const rv=AC.createConvolver();rv.buffer=ir;const wet=AC.createGain();wet.gain.value=.22;MG.connect(cmp);MG.connect(rv).connect(wet).connect(cmp);cmp.connect(AC.destination);
const loop=()=>{const d=buildScore(AC,MG,AC.currentTime+.15);mt=setTimeout(loop,(d+15)*1000)};loop()}
function stopMusic(){if(!AC)return;clearTimeout(mt);const a=AC;MG.gain.linearRampToValueAtTime(0,a.currentTime+.8);setTimeout(()=>a.close(),1000);AC=null}
$('mBtn').onclick=()=>{try{if(AC){stopMusic();$('mBtn').textContent='▶';$('mTxt').textContent='מוזיקה בזמן ההמתנה';$('mus').classList.remove('on')}else{startMusic();$('mBtn').textContent='❚❚';$('mTxt').textContent='מתנגן…';$('mus').classList.add('on')}}catch(e){$('mTxt').textContent='המכשיר לא תומך בנגינה'}};
$('send').onclick=()=>{const v=$('msg').value.trim();if(!v)return;$('send').disabled=true;
 pub({title:'הודעה מהמחסן',message:v,actions:acts}).then(r=>{if(!r.ok)throw 0;$('msg').value='';$('send').textContent='נשלח ✓';setTimeout(()=>{$('send').textContent='שלח';$('send').disabled=false},1500)}).catch(()=>{$('send').disabled=false;$('send').textContent='נסו שוב'})};
}
</script></body></html>
